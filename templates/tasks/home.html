
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager - Home</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 10px #ddd;
        }

        h1 {
            color: #263b5e;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin: 12px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button, .link {
            display: inline-block;
            padding: 12px 18px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
            text-decoration: none;
            cursor: pointer;
        }

        .link {
            background: #475569;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Task Manager</h1>

        <p>Welcome! Add a new task below.</p>

        <form method="POST">
            {% csrf_token %}

            <label for="title">Task name:</label>

            <input
                type="text"
                id="title"
                name="title"
                maxlength="200"
                placeholder="Enter a task..."
                required
            >

            <button type="submit">Add Task</button>
        </form>

        <a class="link" href="{% url 'task_list' %}">
            View All Tasks
        </a>
    </div>
</body>
</html>
